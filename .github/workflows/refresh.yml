name: Refresh hackathon data

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Refresh hackathon data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: python -m scraper.main

      - name: Validate refreshed data
        run: |
          python -c "import json; from pathlib import Path; data = json.loads(Path('public/hackathons.json').read_text(encoding='utf-8')); assert len(data) >= 30, f'Expected at least 30 records, got {len(data)}'"

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hackathons.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh hackathon data"
            git push
          fi
